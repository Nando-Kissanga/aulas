      {
        type: "lesson",
        title: "📐 Operações com Vetores",
        content: `<p>Sejam \\(\\vec{u} = (u_1, u_2, u_3)\\) e \\(\\vec{v} = (v_1, v_2, v_3)\\). A soma é feita componente a componente. O produto por escalar \\(k\\) multiplica todas as componentes.</p>`,
        formula: `\\vec{u} + \\vec{v} = (u_1+v_1, u_2+v_2, u_3+v_3) \\quad \\text{e} \\quad k\\vec{u} = (ku_1, ku_2, ku_3)`,

      {
        type: "lesson",

        solution: `\\|\\vec{w}\\| = \\sqrt{1^2 + 2^2 + 2^2} = \\sqrt{9} = 3. \\text{ Versor: } \\left(\\frac{1}{3}, \\frac{2}{3}, \\frac{2}{3}\\right)`
      },

        formula: `M = \\left( \\frac{x_A+x_B}{2}, \\frac{y_A+y_B}{2}, \\frac{z_A+z_B}{2} \\right) \\quad G = \\left( \\frac{x_A+x_B+x_C}{3}, \\frac{y_A+y_B+y_C}{3}, \\frac{z_A+z_B+z_C}{3} \\right)`,

  {

        type: "lesson",

        content: `<p>Um vetor \\(\\vec{w}\\) é combinação linear de \\(\\vec{v}_1, \\vec{v}_2\\) se puder ser escrito como soma de múltiplos escalares desses vetores.</p>`,
        formula: `\\vec{w} = \\alpha\\vec{v}_1 + \\beta\\vec{v}_2`,
        example: `<p>\\(\\vec{w} = (7, 5)\\) é CL de \\(\\vec{v}_1=(1,0)\\) e \\(\\vec{v}_2=(0,1)\\)?</p><p>Sim, pois \\(7(1,0) + 5(0,1) = (7, 5)\\). Logo, \\(\\alpha=7, \\beta=5\\).</p>`,

        solution: `\\text{Sim. Resolvendo o sistema: } \\alpha + 2\\beta = 5 \\text{ e } 2\\alpha + \\beta = 7. \\text{ Solução: } \\alpha = 3, \\beta = 1.`

        content: `<p>Resultado é um <strong>vetor</strong> perpendicular ao plano formado por \\(\\vec{u}\\) e \\(\\vec{v}\\) (Regra da Mão Direita). O módulo representa a área do paralelogramo.</p>`,
        formula: `\\vec{u} \\times \\vec{v} = \\begin{vmatrix} \\vec{i} & \\vec{j} & \\vec{k} \\\\ u_1 & u_2 & u_3 \\\\ v_1 & v_2 & v_3 \\end{vmatrix}`,

        example: `<p>Volume com \\(\\vec{i}, \\vec{j}, \\vec{k}\\):</p><p>\\(\\begin{vmatrix} 1 & 0 & 0 \\\\ 0 & 1 & 0 \\\\ 0 & 0 & 1 \\end{vmatrix} = 1\\). Volume = 1 u.v.</p>`,
        exercise: "Verifique se os vetores (1,0,1), (0,1,1) e (1,1,2) são coplanares.",
        solution: `\\text{Calculando o determinante: } 1(2-1) - 0 + 1(0-1) = 1 - 1 = 0. \\text{ Como é 0, o volume é nulo, logo são coplanares (LD).}`

    ]
  },
  {
    id: 4, emoji: "📐", title: "Ângulos, Distâncias e Projeções",
    sections: [
      {
        type: "lesson",
        title: "📏 Ângulo entre Vetores",

      },

        type: "lesson",

  },

// -------------------------------------------------------------
// RENDER
// -------------------------------------------------------------
function renderNavigation() {
  const navList = document.getElementById('navList');
  navList.innerHTML = allChapters.map((ch, i) => `
    <div class="chapter-section">
      <div class="chapter-header ${i===0?'active':''}" onclick="toggleChapter(${ch.id})">
        <span>${ch.emoji} ${ch.title}</span>
        <span style="transition:transform 0.3s" id="arrow-${ch.id}">▼</span>
      </div>
      <div class="chapter-content ${i===0?'show':''}" id="content-${ch.id}">
        ${ch.sections.map((sec,j) => `
          <div class="nav-item ${i===0&&j===0?'active':''}" onclick="showSection(${ch.id},${j},this)">
            <span>📚</span> ${sec.title.replace(/[📐📏📉🔄📦🔢🏛️🏗️🎯🔵🔴🗼]/g,'').trim()}
          </div>
        `).join('')}
      </div>
    </div>
  `).join('');
}

function toggleChapter(id) {
  const content = document.getElementById(`content-${id}`);
  const header = content.previousElementSibling;
  const arrow = document.getElementById(`arrow-${id}`);
  document.querySelectorAll('.chapter-content').forEach(c => { if(c.id!==`content-${id}`) c.classList.remove('show'); });
  document.querySelectorAll('.chapter-header').forEach(h => { if(h!==header) h.classList.remove('active'); });
  document.querySelectorAll('[id^="arrow-"]').forEach(a => { if(a.id!==`arrow-${id}`) a.style.transform='rotate(0deg)'; });
  content.classList.toggle('show');
  header.classList.toggle('active');
  arrow.style.transform = content.classList.contains('show') ? 'rotate(180deg)' : 'rotate(0deg)';
}

function showSection(chapterId, sectionIndex, element) {
  if(element) { document.querySelectorAll('.nav-item').forEach(el=>el.classList.remove('active')); element.classList.add('active'); }
  const chapter = allChapters.find(c=>c.id===chapterId);
  if(!chapter) return;
  renderChapter(chapter);
  if(window.innerWidth<=968) document.getElementById('sidebar').classList.remove('show');
}

function renderChapter(chapter) {
  let html = `<h2>${chapter.emoji} ${chapter.title}</h2>`;
  chapter.sections.forEach((section, idx) => {
    const sid = `${chapter.id}_${idx}`;
    if(section.type==='lesson') {
      html += `
        <div class="lesson-box">
          <div class="lesson-header">${section.title}</div>
          <div class="lesson-content">
            <div class="concept-subbox"><h4>📖 Conceito</h4>${section.content}${section.formula?`<div class="formula-inline">$$ ${section.formula} $$</div>`:''}</div>
            <div class="example-subbox"><h4>💡 Exemplo Resolvido</h4>${section.example}</div>
            <div class="exercise-subbox"><h4>✏️ Exercício Proposto</h4><p>${section.exercise}</p><button class="show-solution" onclick="toggleSolution('sol_${sid}')">🔓 Ver Solução Detalhada</button><div id="sol_${sid}" class="solution">$$ ${section.solution} $$</div></div>
          </div>
        </div>
      `;
    }
  });
  document.getElementById('mainContent').innerHTML = html;
  if(window.MathJax) MathJax.typesetPromise().catch(e=>console.log(e));
}

function toggleSolution(id) {
  const sol = document.getElementById(id);
  sol.style.display = sol.style.display==='block' ? 'none' : 'block';
  if(sol.style.display==='block' && window.MathJax) MathJax.typesetPromise([sol]);
}

function toggleMenu() { document.getElementById('sidebar').classList.toggle('show'); }

window.onload = function() { renderNavigation(); showSection(1,0); };
</script>
