<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>O Alfabeto Inglês - Academia Nova Geração</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&family=Satisfy&family=Amatic+SC:wght@700&family=Gloria+Hallelujah&family=Comic+Neue:wght@700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Comic Neue', 'Patrick Hand', cursive, sans-serif;
      background: linear-gradient(135deg, #ffeaa7, #fab1a0, #fd79a8, #a29bfe);
      background-size: 400% 400%;
      animation: gradientShift 15s ease infinite;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 16px;
      overflow-x: hidden;
    }
    @keyframes gradientShift {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }
    .deck {
      width: 100%;
      max-width: 900px;
      background: white;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 15px 50px rgba(0,0,0,0.3);
      display: flex;
      flex-direction: column;
      position: relative;
      border: 5px solid #2d3436;
    }
    .top-bar {
      background: linear-gradient(135deg, #6c5ce7, #a29bfe);
      padding: 16px 24px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      color: white;
      font-size: 16px;
      border-bottom: 4px solid #2d3436;
    }
    .author-name {
      font-family: 'Gloria Hallelujah', cursive;
      font-size: 22px;
      color: #ffeaa7;
      text-shadow: 2px 2px 0px #2d3436;
    }
    .contact-info {
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
      color: #dfe6e9;
      font-size: 15px;
      font-weight: bold;
    }
    .watermark {
      position: absolute;
      font-family: 'Amatic SC', cursive;
      font-size: 200px;
      font-weight: bold;
      color: rgba(108, 92, 231, 0.08);
      pointer-events: none;
      z-index: 0;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) rotate(-15deg);
      text-shadow: 3px 3px 0px rgba(0,0,0,0.1);
    }
    .stage {
      position: relative;
      width: 100%;
      padding-bottom: 68%;
      background: linear-gradient(135deg, #fff5e6, #ffe6f0);
      overflow: hidden;
    }
    .slides-container {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
    }
    .slide {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      opacity: 0; visibility: hidden;
      transition: opacity 0.5s, visibility 0.5s, transform 0.5s;
      overflow-y: auto;
      padding: 28px 32px;
      background: white;
      transform: scale(0.95) rotateY(10deg);
    }
    .slide.active {
      opacity: 1; visibility: visible; z-index: 2;
      transform: scale(1) rotateY(0deg);
    }
    .content {
      max-width: 720px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      justify-content: center;
      min-height: 100%;
      position: relative;
      z-index: 1;
    }
    h1 {
      font-family: 'Gloria Hallelujah', cursive;
      font-size: 32px;
      color: #6c5ce7;
      margin-bottom: 16px;
      padding-bottom: 10px;
      border-bottom: 4px dashed #fd79a8;
      text-shadow: 2px 2px 0px #dfe6e9;
    }
    h2 {
      font-family: 'Amatic SC', cursive;
      font-size: 28px;
      color: #e17055;
      margin-bottom: 14px;
      text-shadow: 1px 1px 0px #dfe6e9;
    }
    .badge {
      display: inline-block;
      background: linear-gradient(135deg, #fdcb6e, #e17055);
      color: white;
      padding: 6px 18px;
      border-radius: 20px;
      font-size: 13px;
      margin-bottom: 16px;
      text-transform: uppercase;
      letter-spacing: 2px;
      font-weight: 700;
      border: 3px solid #2d3436;
      box-shadow: 3px 3px 0px #2d3436;
    }
    .grid-2col {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 14px;
      margin: 16px 0;
    }
    .grid-3col {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(110px, 1fr));
      gap: 10px;
      margin: 14px 0;
    }
    .card {
      background: linear-gradient(135deg, #fff, #f8f9fa);
      border-radius: 15px;
      padding: 16px;
      border: 3px solid #2d3436;
      text-align: center;
      transition: all 0.3s;
      cursor: default;
      box-shadow: 4px 4px 0px #2d3436;
    }
    .card:hover {
      transform: translateY(-5px) rotate(2deg);
      border-color: #fd79a8;
      box-shadow: 6px 6px 0px #fd79a8;
      background: linear-gradient(135deg, #fff5e6, #ffe6f0);
    }
    .card-icon { font-size: 38px; display: block; margin-bottom: 8px; animation: bounce 2s infinite; }
    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }
    .highlight {
      background: linear-gradient(135deg, #fff3cd, #ffeaa7);
      padding: 14px 18px;
      border-radius: 12px;
      margin: 14px 0;
      border-left: 6px solid #fdcb6e;
      font-weight: 600;
      border: 2px solid #2d3436;
      box-shadow: 3px 3px 0px rgba(0,0,0,0.1);
    }
    .highlight-blue { background: linear-gradient(135deg, #dfe6e9, #74b9ff); border-left-color: #0984e3; }
    .highlight-green { background: linear-gradient(135deg, #dfe6e9, #55efc4); border-left-color: #00b894; }
    .highlight-red { background: linear-gradient(135deg, #ffeaa7, #ff7675); border-left-color: #d63031; }
    .highlight-purple { background: linear-gradient(135deg, #dfe6e9, #a29bfe); border-left-color: #6c5ce7; }
    .alert-box {
      background: linear-gradient(135deg, #fff3cd, #ffeaa7);
      border: 3px solid #fdcb6e;
      padding: 14px 18px;
      border-radius: 12px;
      margin: 14px 0;
      text-align: center;
      font-weight: 600;
      box-shadow: 3px 3px 0px #2d3436;
    }
    .success-box {
      background: linear-gradient(135deg, #dfe6e9, #55efc4);
      border: 3px solid #00b894;
      padding: 14px 18px;
      border-radius: 12px;
      margin: 14px 0;
      text-align: center;
      font-weight: 600;
      box-shadow: 3px 3px 0px #2d3436;
    }
    .quote-box {
      background: linear-gradient(135deg, #f8f9fa, #dfe6e9);
      border-left: 6px solid #636e72;
      padding: 14px 18px;
      border-radius: 0 12px 12px 0;
      margin: 14px 0;
      font-family: 'Satisfy', cursive;
      font-size: 19px;
      border: 2px solid #2d3436;
    }
    .tag {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 6px;
      font-size: 12px;
      margin: 3px;
      font-weight: 600;
      border: 2px solid #2d3436;
      box-shadow: 2px 2px 0px #2d3436;
    }
    .tag-blue { background: #74b9ff; color: #0984e3; }
    .tag-green { background: #55efc4; color: #00b894; }
    .tag-red { background: #ff7675; color: #d63031; }
    .tag-purple { background: #a29bfe; color: #6c5ce7; }
    .tag-orange { background: #fdcb6e; color: #e17055; }
    .underline {
      text-decoration: underline;
      text-decoration-color: #e17055;
      text-underline-offset: 4px;
      text-decoration-thickness: 3px;
    }
    .text-center { text-align: center; }
    .divider {
      border: none;
      border-top: 3px dashed #b2bec3;
      margin: 18px 0;
    }
    .formula-box {
      background: linear-gradient(135deg, #f8f9fa, #dfe6e9);
      padding: 14px 18px;
      border-radius: 12px;
      margin: 12px 0;
      font-family: 'Courier New', monospace;
      font-size: 17px;
      border-left: 5px solid #6c5ce7;
      border: 2px solid #2d3436;
      box-shadow: 3px 3px 0px rgba(0,0,0,0.1);
    }
    .step-list { display: flex; flex-direction: column; gap: 12px; }
    .step-item {
      background: white;
      padding: 14px 18px;
      border-radius: 12px;
      border-left: 5px solid #a29bfe;
      transition: all 0.3s;
      display: flex;
      align-items: center;
      gap: 12px;
      border: 2px solid #2d3436;
      box-shadow: 3px 3px 0px rgba(0,0,0,0.1);
    }
    .step-item:hover {
      border-left-color: #e17055;
      transform: translateX(6px);
      background: linear-gradient(135deg, #fff5e6, #ffe6f0);
    }
    .step-number {
      background: linear-gradient(135deg, #e17055, #fd79a8);
      color: white;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 15px;
      flex-shrink: 0;
      border: 2px solid #2d3436;
      box-shadow: 2px 2px 0px #2d3436;
    }
    
    /* NAVIGATION BUTTONS - REDUZIDOS */
    .nav-bar {
      background: linear-gradient(135deg, #2d3436, #636e72);
      padding: 12px 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      border-top: 4px solid #2d3436;
      flex-wrap: wrap;
    }
    .nav-btn {
      background: linear-gradient(135deg, #fd79a8, #e17055);
      border: 2px solid white;
      color: white;
      padding: 8px 18px;
      border-radius: 30px;
      cursor: pointer;
      font-size: 14px;
      font-family: 'Comic Neue', cursive;
      font-weight: 700;
      transition: all 0.3s;
      box-shadow: 0 4px 0px #2d3436, 0 5px 12px rgba(0,0,0,0.3);
      display: flex;
      align-items: center;
      gap: 6px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .nav-btn:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 6px 0px #2d3436, 0 8px 15px rgba(0,0,0,0.4);
      background: linear-gradient(135deg, #e17055, #fdcb6e);
    }
    .nav-btn:active:not(:disabled) {
      transform: translateY(2px);
      box-shadow: 0 2px 0px #2d3436, 0 3px 6px rgba(0,0,0,0.3);
    }
    .nav-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
      filter: grayscale(0.5);
    }
    .nav-btn-icon {
      font-size: 16px;
      display: inline-block;
      transition: transform 0.3s;
    }
    .nav-btn:hover:not(:disabled) .nav-btn-icon {
      transform: translateX(-2px);
    }
    .nav-btn:hover:not(:disabled) .nav-btn-icon-next {
      transform: translateX(2px);
    }
    .nav-center {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      flex: 1;
      min-width: 180px;
    }
    .dots { display: flex; gap: 6px; padding: 0 6px; flex-wrap: wrap; justify-content: center; }
    .dot {
      width: 10px; height: 10px;
      background: #636e72;
      border-radius: 50%;
      cursor: pointer;
      transition: all 0.3s;
      border: 2px solid white;
    }
    .dot:hover {
      transform: scale(1.3);
      background: #fdcb6e;
    }
    .dot.active {
      background: #fdcb6e;
      width: 24px;
      border-radius: 10px;
      box-shadow: 0 0 8px rgba(253, 203, 110, 0.8);
    }
    .counter {
      font-size: 12px;
      background: white;
      padding: 4px 12px;
      border-radius: 12px;
      border: 2px solid #2d3436;
      font-weight: 700;
      color: #2d3436;
    }
    .progress-bar {
      width: 100%;
      height: 6px;
      background: #dfe6e9;
      border-bottom: 2px solid #2d3436;
    }
    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #fd79a8, #e17055, #fdcb6e);
      transition: width 0.5s;
      box-shadow: 0 0 10px rgba(253, 121, 168, 0.5);
    }
    
    /* ANIMAÇÕES CSS */
    .anim-float { animation: float 3s ease-in-out infinite; display: inline-block; }
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-15px); }
    }
    .anim-pulse { animation: pulse 1.5s ease-in-out infinite; display: inline-block; }
    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.15); }
    }
    .anim-rotate { animation: rotate 4s linear infinite; display: inline-block; }
    @keyframes rotate {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    .anim-shake { animation: shake 0.8s ease-in-out infinite; display: inline-block; }
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-5px) rotate(-5deg); }
      75% { transform: translateX(5px) rotate(5deg); }
    }
    .anim-wave { animation: wave 2s ease-in-out infinite; display: inline-block; }
    @keyframes wave {
      0%, 100% { transform: rotate(0deg); }
      25% { transform: rotate(15deg); }
      75% { transform: rotate(-15deg); }
    }
    .anim-bounce-big { animation: bounceBig 2s ease-in-out infinite; display: inline-block; }
    @keyframes bounceBig {
      0%, 100% { transform: translateY(0) scale(1); }
      50% { transform: translateY(-20px) scale(1.1); }
    }
    .anim-spin-slow { animation: spinSlow 8s linear infinite; display: inline-block; }
    @keyframes spinSlow {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    
    /* ALPHABET LETTER CARDS */
    .letter-card {
      background: linear-gradient(135deg, #fff, #fff5e6);
      border: 3px solid #2d3436;
      border-radius: 12px;
      padding: 10px 6px;
      text-align: center;
      box-shadow: 3px 3px 0px #2d3436;
      transition: all 0.3s;
      cursor: default;
    }
    .letter-card:hover {
      transform: translateY(-4px) rotate(-2deg);
      border-color: #fd79a8;
      box-shadow: 5px 5px 0px #fd79a8;
    }
    .letter-big {
      font-family: 'Gloria Hallelujah', cursive;
      font-size: 32px;
      font-weight: bold;
      color: #6c5ce7;
      display: block;
      text-shadow: 2px 2px 0px #ffeaa7;
    }
    .letter-phonetic {
      font-family: 'Courier New', monospace;
      font-size: 11px;
      color: #636e72;
      display: block;
      margin: 2px 0;
    }
    .letter-emojis {
      font-size: 22px;
      display: block;
      margin-top: 4px;
      letter-spacing: 2px;
    }
    .letter-card.vowel { background: linear-gradient(135deg, #ffeaa7, #fdcb6e); }
    .letter-card.consonant { background: linear-gradient(135deg, #74b9ff, #a8d8ff); }
    .letter-card.semivowel { background: linear-gradient(135deg, #a29bfe, #d5d3ff); }
    
    /* FULL ALPHABET - COM PRONÚNCIA */
    .alpha-full {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
      margin: 14px 0;
    }
    .alpha-letter-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      transition: all 0.3s;
      cursor: default;
    }
    .alpha-letter-box:hover {
      transform: scale(1.15) rotate(5deg);
    }
    .alpha-letter {
      font-family: 'Gloria Hallelujah', cursive;
      font-size: 26px;
      font-weight: bold;
      width: 38px;
      height: 38px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      border: 3px solid #2d3436;
      box-shadow: 2px 2px 0px #2d3436;
    }
    .alpha-pronunciation {
      font-family: 'Comic Neue', cursive;
      font-size: 10px;
      font-weight: 700;
      color: #2d3436;
      background: white;
      padding: 1px 5px;
      border-radius: 8px;
      border: 1.5px solid #2d3436;
      box-shadow: 1px 1px 0px #2d3436;
      white-space: nowrap;
    }
    .alpha-vowel { background: #fdcb6e; color: #2d3436; }
    .alpha-consonant { background: #74b9ff; color: #0984e3; }
    .alpha-semivowel { background: #a29bfe; color: white; }
    
    math {
      font-family: 'Courier New', monospace;
      font-size: 18px;
      background: linear-gradient(135deg, #fff3cd, #ffeaa7);
      padding: 8px 14px;
      border-radius: 8px;
      border: 2px solid #2d3436;
      display: inline-block;
      margin: 5px 0;
    }
    
    @media (max-width: 600px) {
      body { padding: 10px; }
      .slide { padding: 20px; }
      h1 { font-size: 24px; }
      h2 { font-size: 22px; }
      .grid-2col { grid-template-columns: 1fr; }
      .grid-3col { grid-template-columns: repeat(2, 1fr); }
      .watermark { font-size: 120px; }
      .nav-btn { padding: 6px 14px; font-size: 12px; }
      .letter-big { font-size: 24px; }
      .letter-emojis { font-size: 18px; }
      .alpha-letter { font-size: 18px; width: 30px; height: 30px; }
      .alpha-pronunciation { font-size: 8px; padding: 1px 3px; }
      .alpha-full { gap: 5px; }
    }
  </style>
</head>
<body>
<div class="deck">
  <header class="top-bar">
    <span class="author-name">🆖 Academia Nova Geração / New Generation</span>
    <div class="contact-info">
      <span>📱 WhatsApp: 934644260</span>
    </div>
  </header>

  <div class="progress-bar"><div class="progress-fill" id="progressFill" style="width: 9.1%;"></div></div>

  <div class="stage">
    <div class="slides-container" id="slidesContainer"></div>
  </div>

  <nav class="nav-bar">
    <button class="nav-btn" id="prevBtn">
      <span class="nav-btn-icon">◀</span>
    </button>
    <div class="nav-center">
      <div class="dots" id="dotsContainer"></div>
      <div class="counter" id="counterDisplay">1 / 11</div>
    </div>
    <button class="nav-btn" id="nextBtn">
      <span class="nav-btn-icon nav-btn-icon-next">▶</span>
    </button>
  </nav>
</div>

<script>
  (function() {

      {

      {

      },
      {
        title: "1. O Alfabeto Inglês",
        badge: "🔤 Estrutura",
        content: `
          <div class="highlight" style="text-align: center; font-size: 20px;">

            ${slide.content}
          </div>
        </div>
      `).join('');
    }

    function renderDots() {
      dotsContainer.innerHTML = slidesData.map((_, idx) => `
        <span class="dot ${idx === state.currentIndex ? 'active' : ''}" data-index="${idx}"></span>
      `).join('');

      document.querySelectorAll('.dot').forEach(dot => {
        dot.addEventListener('click', (e) => {
          const index = parseInt(e.currentTarget.dataset.index);
          if (index !== state.currentIndex) goToSlide(index);
        });
      });
    }

    function updateButtons() {
      prevBtn.disabled = state.currentIndex === 0;
      nextBtn.disabled = state.currentIndex === state.totalSlides - 1;
    }

    function updateActiveSlide() {
      document.querySelectorAll('.slide').forEach((s, i) => s.classList.toggle('active', i === state.currentIndex));
      document.querySelectorAll('.dot').forEach((d, i) => d.classList.toggle('active', i === state.currentIndex));
      counterDisplay.textContent = `${state.currentIndex + 1} / ${state.totalSlides}`;
      progressFill.style.width = `${((state.currentIndex + 1) / state.totalSlides) * 100}%`;
      updateButtons();
    }

    function goToSlide(index) {
      if (index < 0 || index >= state.totalSlides || index === state.currentIndex) return;
      state.currentIndex = index;
      updateActiveSlide();
    }

    function nextSlide() {
      if (state.currentIndex < state.totalSlides - 1) goToSlide(state.currentIndex + 1);
    }

    function prevSlide() {
      if (state.currentIndex > 0) goToSlide(state.currentIndex - 1);
    }

    prevBtn.addEventListener('click', prevSlide);
    nextBtn.addEventListener('click', nextSlide);

    document.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight') nextSlide();
      if (e.key === 'ArrowLeft') prevSlide();
    });

    renderAllSlides();
    renderDots();
    updateActiveSlide();
  })();
</script>
</body>
</html>
